<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Analytics Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        h1 { margin: 0; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, select, button { padding: 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f5f5f5; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .badge { background: #e3f2fd; color: #1565c0; padding: 3px 8px; border-radius: 3px; font-size: 12px; }
        .hidden { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #eee; }
        .stat-value { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 Game Analytics Dashboard</h1>
        <p>Connect your Google Sheet to view user events</p>
    </div>

    <div class="card">
        <p><strong>Share your Google Sheet publicly, then paste the link below:</strong></p>
        <input type="text" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/..." style="width: 70%;">
        <button onclick="loadSheet()">Load Sheet</button>
        <div id="error" class="hidden" style="color: red; margin-top: 10px;"></div>
    </div>

    <div id="stats" class="hidden">
        <div class="stats-grid">
            <div class="stat-card"><div style="font-size: 12px; color: #666;">Total Events</div><div class="stat-value" id="totalEvents">0</div></div>
            <div class="stat-card"><div style="font-size: 12px; color: #666;">Active Users</div><div class="stat-value" id="totalUsers">0</div></div>
            <div class="stat-card"><div style="font-size: 12px; color: #666;">Highest Level</div><div class="stat-value" id="maxLevel">0</div></div>
            <div class="stat-card"><div style="font-size: 12px; color: #666;">Themes</div><div class="stat-value" id="themes">0</div></div>
        </div>

        <div class="card">
            <h3>Search & Filter</h3>
            <input type="text" id="searchId" placeholder="Search user ID..." onkeyup="renderTable()">
            <select id="levelRange" onchange="renderTable()" style="margin-left: 10px;">
                <option value="all">All Levels</option>
                <option value="1-10">1-10</option>
                <option value="11-20">11-20</option>
                <option value="21-30">21-30</option>
            </select>
            <div id="eventCount" style="margin-top: 10px; font-size: 13px;">Found <strong>0</strong> events</div>
        </div>

        <div class="card">
            <div id="tableSection"></div>
        </div>
    </div>

    <script>
        let allEvents = [];

        async function loadSheet() {
            const url = document.getElementById('sheetUrl').value;
            const error = document.getElementById('error');
            error.classList.add('hidden');

            if (!url) {
                error.textContent = 'Please paste a URL';
                error.classList.remove('hidden');
                return;
            }

            try {
                const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
                const gidMatch = url.match(/[#&]gid=([0-9]+)/);
                const sheetId = match ? match[1] : '';
                const gid = gidMatch ? gidMatch[1] : '0';

                if (!sheetId) throw new Error('Invalid URL');

                const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
                const response = await fetch(csvUrl);
                const text = await response.text();
                const lines = text.trim().split('\n');

                allEvents = lines.slice(1).map(line => {
                    const vals = line.split('\t');
                    return { id: vals[0], event: vals[1], level: parseInt(vals[2]) || 0, theme: vals[6] || '', timestamp: vals[4] };
                });

                updateStats();
                renderTable();
                document.getElementById('stats').classList.remove('hidden');
            } catch (e) {
                error.textContent = 'Error: Make sure sheet is public. ' + e.message;
                error.classList.remove('hidden');
            }
        }

        function updateStats() {
            const users = new Set(allEvents.map(e => e.id)).size;
            const max = Math.max(...allEvents.map(e => e.level));
            const themes = new Set(allEvents.map(e => e.theme).filter(t => t)).size;
            document.getElementById('totalEvents').textContent = allEvents.length;
            document.getElementById('totalUsers').textContent = users;
            document.getElementById('maxLevel').textContent = max;
            document.getElementById('themes').textContent = themes;
        }

        function renderTable() {
            const search = document.getElementById('searchId').value;
            const range = document.getElementById('levelRange').value;
            const [min, max] = range === 'all' ? [0, 999] : range.split('-').map(Number);

            let filtered = allEvents.filter(e => e.level >= min && e.level <= max);
            if (search) filtered = filtered.filter(e => e.id.includes(search));

            document.getElementById('eventCount').innerHTML = `Found <strong>${filtered.length}</strong> events`;

            let html = '<table><thead><tr><th>Event</th><th>Level</th><th>Theme</th><th>Timestamp</th></tr></thead><tbody>';
            filtered.slice(0, 50).forEach(e => {
                html += `<tr><td><span class="badge">${e.event}</span></td><td>${e.level}</td><td>${e.theme || '—'}</td><td>${e.timestamp}</td></tr>`;
            });
            html += '</tbody></table>';
            if (filtered.length > 50) html += `<p style="text-align: center; color: #666; font-size: 12px;">Showing 50 of ${filtered.length}</p>`;
            document.getElementById('tableSection').innerHTML = html;
        }
    </script>
</body>
</html>
